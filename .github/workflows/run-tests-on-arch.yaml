name: Run all Bash tests on Arch Linux

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests on Arch Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    env:
      EXPECTED_DISTRO_ID: arch

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed bash git ca-certificates coreutils grep sed

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Make tests executable
        run: |
          chmod +x test/*.test.sh

      - name: Run all tests
        shell: bash
        run: |
          set -euo pipefail

          for test_file in test/*.test.sh; do
            echo "Running: $test_file"
            bash "$test_file"
          done
